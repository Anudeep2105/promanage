services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-project_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_app_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server/server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-project_app}:${POSTGRES_PASSWORD:-project_app_local_password}@db:5432/${POSTGRES_DB:-project_mgmt}?schema=public
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      APP_URL: http://localhost:3000
      WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
